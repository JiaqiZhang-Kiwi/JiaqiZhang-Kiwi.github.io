<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>徒步三维地形工作台演示</title>
  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.11.1/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.11.1/maptiler-sdk.css" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #263238;
      background: #111817;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    .route-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .route-tooltip {
      position: absolute;
      min-width: 136px;
      padding: 8px 10px;
      border: 1px solid rgba(38, 50, 56, .2);
      border-radius: 7px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 12px 32px rgba(12, 20, 22, .24);
      color: #263238;
      font-size: 11px;
      line-height: 1.45;
      pointer-events: none;
      display: none;
      z-index: 4;
    }

    .route-tooltip strong {
      display: block;
      font-size: 12px;
    }

    .topbar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 8px;
      background: rgba(20, 31, 32, .84);
      color: #fff;
      backdrop-filter: blur(12px);
      z-index: 3;
    }

    .brand {
      font-weight: 700;
      font-size: 14px;
      margin-right: 10px;
    }

    .tool {
      height: 30px;
      display: inline-flex;
      align-items: center;
      padding: 0 10px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 6px;
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.92);
      font-size: 12px;
      white-space: nowrap;
    }

    .tool input[type="file"] {
      display: none;
    }

    .tool.file-tool {
      cursor: pointer;
    }

    .status {
      margin-left: auto;
      color: rgba(255,255,255,.7);
      font-size: 12px;
      white-space: nowrap;
    }

    .panel {
      position: absolute;
      top: 76px;
      bottom: 18px;
      width: 300px;
      padding: 12px;
      border: 1px solid rgba(38, 50, 56, .18);
      border-radius: 8px;
      background: rgba(250, 250, 250, .94);
      box-shadow: 0 16px 48px rgba(12, 20, 22, .2);
      backdrop-filter: blur(10px);
      z-index: 2;
      overflow: auto;
    }

    .left-panel {
      left: 14px;
    }

    .right-panel {
      right: 14px;
      width: 230px;
    }

    .card {
      border: 1px solid #dce3e6;
      border-radius: 7px;
      background: #fff;
      padding: 10px;
      margin-bottom: 12px;
    }

    .card h3 {
      margin: 0 0 9px;
      color: #455a64;
      font-size: 12px;
    }

    .route-list {
      display: grid;
      gap: 8px;
      max-height: 190px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .route-item {
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      background: #f7faf9;
      padding: 8px;
      cursor: pointer;
    }

    .route-item.active {
      border-color: #2f7d59;
      background: #edf7f1;
      box-shadow: inset 3px 0 0 #2f7d59;
    }

    .route-item.completed {
      background: #f2f4f4;
    }

    .route-item-head {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 7px;
    }

    .route-complete {
      width: 15px;
      height: 15px;
      accent-color: #2f7d59;
      cursor: pointer;
    }

    .route-name-input {
      width: 100%;
      min-width: 0;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: #263238;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      outline: 0;
    }

    .route-name-input:focus {
      border-bottom-color: #2f7d59;
    }

    .route-item.completed .route-name-input {
      color: #78909c;
      text-decoration: line-through;
    }

    .route-meta {
      margin-top: 5px;
      padding-left: 22px;
      color: #607d8b;
      font-size: 11px;
      line-height: 1.45;
    }

    .basemap-row,
    .legend-row,
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #37474f;
    }

    .control-row {
      align-items: flex-start;
      flex-direction: column;
      gap: 6px;
    }

    .control-row span {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .control-row input[type="range"] {
      width: 100%;
      accent-color: #2f7d59;
    }

    .swatches {
      display: flex;
      gap: 7px;
    }

    .color-swatch {
      width: 24px;
      height: 24px;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px #cfd8dc;
      cursor: pointer;
    }

    .color-swatch.active {
      box-shadow: 0 0 0 2px #263238;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
      color: #37474f;
    }

    .check-row input {
      accent-color: #2f7d59;
    }

    .collapse-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #455a64;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .collapse-body {
      margin-top: 10px;
    }

    .card.collapsed .collapse-body {
      display: none;
    }

    .basemap-row button {
      border: 1px solid #ccd6da;
      border-radius: 5px;
      background: #f5f8f9;
      color: #37474f;
      font: inherit;
      font-size: 11px;
      padding: 4px 7px;
      cursor: pointer;
    }

    .basemap-row button.active {
      border-color: #2f7d59;
      background: #e4f3eb;
      color: #1f5c40;
      font-weight: 700;
    }

    .swatch {
      width: 16px;
      height: 12px;
      display: inline-block;
      border-radius: 2px;
      margin-right: 7px;
      vertical-align: -2px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 11px;
    }

    .stat {
      min-height: 58px;
      padding: 8px;
      border-radius: 6px;
      background: #f3f6f6;
    }

    .stat span {
      display: block;
      color: #607d8b;
    }

    .stat strong {
      display: block;
      margin-top: 4px;
      color: #263238;
      font-size: 15px;
    }

    .stat small {
      display: block;
      margin-top: 3px;
      color: #607d8b;
      font-size: 10px;
    }

    .difficulty-stat {
      grid-column: 1 / -1;
      min-height: 64px;
    }

    .difficulty-stat strong {
      color: #b26a00;
      letter-spacing: 1px;
    }

    .weather-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
      color: #607d8b;
      font-size: 11px;
    }

    .weather-head button {
      border: 1px solid #ccd6da;
      border-radius: 5px;
      background: #f5f8f9;
      color: #37474f;
      font: inherit;
      font-size: 11px;
      padding: 4px 7px;
      cursor: pointer;
    }

    .weather-main {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 9px;
    }

    .weather-temp {
      color: #263238;
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
    }

    .weather-desc {
      color: #455a64;
      font-size: 12px;
      line-height: 1.5;
    }

    .weather-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 9px;
    }

    .weather-metric {
      padding: 7px;
      border-radius: 6px;
      background: #f3f6f6;
      font-size: 11px;
    }

    .weather-metric span {
      display: block;
      color: #607d8b;
    }

    .weather-metric strong {
      display: block;
      margin-top: 3px;
      color: #263238;
      font-size: 13px;
    }

    .weather-advice {
      padding: 8px;
      border-radius: 6px;
      background: #eef6f0;
      color: #315b42;
      font-size: 11px;
      line-height: 1.55;
    }

    .weather-status {
      color: #78909c;
      font-size: 11px;
      line-height: 1.5;
    }

    .legend-subtitle {
      margin: 10px 0 7px;
      color: #607d8b;
      font-size: 11px;
      font-weight: 700;
    }

    .poi-dot {
      width: 14px;
      height: 14px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      margin-right: 7px;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      vertical-align: -2px;
    }

    .milestone-marker text {
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 4px;
      stroke-linejoin: round;
      font: 700 11px Inter, "Microsoft YaHei", sans-serif;
    }

    .profile {
      position: absolute;
      left: 328px;
      bottom: 18px;
      width: min(520px, calc(100vw - 600px));
      min-width: 360px;
      height: 128px;
      padding: 10px;
      border: 1px solid rgba(38, 50, 56, .18);
      border-radius: 8px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 16px 48px rgba(12, 20, 22, .2);
      backdrop-filter: blur(10px);
      z-index: 2;
    }

    .profile-head {
      display: flex;
      align-items: center;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 700;
      color: #455a64;
    }

    .profile-head span {
      margin-left: auto;
      color: #607d8b;
      font-weight: 500;
      font-size: 11px;
    }

    .error {
      position: absolute;
      left: 50%;
      top: 50%;
      max-width: 560px;
      transform: translate(-50%, -50%);
      padding: 16px;
      border: 1px solid #e5b2a8;
      border-radius: 8px;
      background: #fff7f5;
      color: #7a2f20;
      z-index: 5;
      display: none;
    }

    @media (max-width: 900px) {
      .right-panel {
        display: none;
      }

      .profile {
        left: 14px;
        right: 14px;
        width: auto;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <svg id="routeOverlay" class="route-overlay"></svg>
  <div id="routeTooltip" class="route-tooltip"></div>

  <div class="topbar">
    <div class="brand">徒步三维地形工作台</div>
    <label class="tool file-tool" for="kmlInput">导入 KML<input id="kmlInput" type="file" accept=".kml,application/vnd.google-earth.kml+xml" multiple /></label>
    <div class="tool">绘制路线</div>
    <div class="tool">量测</div>
    <div class="tool">滚轮拖拽旋转</div>
    <div class="status" id="status">正在加载 MapTiler 三维地形...</div>
  </div>

  <aside class="panel left-panel">
    <section class="card">
      <h3>已导入路线</h3>
      <div class="route-list" id="routeList"></div>
    </section>

    <section class="card">
      <h3>轨迹样式</h3>
      <label class="control-row">
        <span>线宽 <output id="widthValue">4 px</output></span>
        <input id="routeWidth" type="range" min="2" max="10" step="1" value="4" />
      </label>
      <label class="control-row">
        <span>透明度 <output id="opacityValue">95%</output></span>
        <input id="routeOpacity" type="range" min="35" max="100" step="5" value="95" />
      </label>
      <div class="control-row">
        <span>颜色</span>
        <div class="swatches">
          <button class="color-swatch active" data-color="#ff3d00" style="background:#ff3d00" aria-label="橙色轨迹"></button>
          <button class="color-swatch" data-color="#00bcd4" style="background:#00bcd4" aria-label="青色轨迹"></button>
          <button class="color-swatch" data-color="#ffd400" style="background:#ffd400" aria-label="黄色轨迹"></button>
          <button class="color-swatch" data-color="#7c4dff" style="background:#7c4dff" aria-label="紫色轨迹"></button>
        </div>
      </div>
      <label class="check-row">
        <input id="routeHalo" type="checkbox" checked />
        高对比描边
      </label>
      <label class="check-row">
        <input id="routeMilestones" type="checkbox" />
        显示公里标
      </label>
      <label class="check-row">
        <input id="routeElevationColor" type="checkbox" />
        按海拔高度着色
      </label>
    </section>

    <section class="card">
      <h3>路线统计</h3>
      <div class="stats">
        <div class="stat"><span>距离</span><strong id="distance">...</strong></div>
        <div class="stat"><span>最高海拔</span><strong id="maxElev">...</strong></div>
        <div class="stat"><span>累计爬升</span><strong id="gain">...</strong></div>
        <div class="stat"><span>累计下降</span><strong id="loss">...</strong></div>
        <div class="stat difficulty-stat"><span>路线难度</span><strong id="difficultyStars">...</strong><small id="difficultyScore">按距离和爬升计算</small></div>
      </div>
    </section>

    <section class="card">
      <h3>天气预报</h3>
      <div class="weather-head">
        <span id="weatherLocation">路线中点天气</span>
        <button id="refreshWeather" type="button">刷新</button>
      </div>
      <div id="weatherStatus" class="weather-status">等待路线位置...</div>
      <div id="weatherBody" style="display:none">
        <div class="weather-main">
          <div class="weather-temp" id="weatherTemp">--°</div>
          <div class="weather-desc" id="weatherDesc">--</div>
        </div>
        <div class="weather-grid">
          <div class="weather-metric"><span>体感</span><strong id="weatherFeels">--</strong></div>
          <div class="weather-metric"><span>风力</span><strong id="weatherWind">--</strong></div>
          <div class="weather-metric"><span>降水</span><strong id="weatherRain">--</strong></div>
          <div class="weather-metric"><span>紫外线</span><strong id="weatherUv">--</strong></div>
          <div class="weather-metric"><span>湿度</span><strong id="weatherHumidity">--</strong></div>
          <div class="weather-metric"><span>能见度</span><strong id="weatherVisibility">--</strong></div>
        </div>
        <div class="weather-advice" id="weatherAdvice">--</div>
      </div>
    </section>

    <section class="card">
      <h3>量测结果</h3>
      <div id="measurementText" style="font-size:12px;color:#546e7a;line-height:1.7">将鼠标移到轨迹上<br>距离和高程会在这里更新。</div>
    </section>
  </aside>

  <aside class="panel right-panel">
    <section class="card" id="maptilerCard">
      <button class="collapse-toggle" id="maptilerToggle" type="button">MapTiler 底图 <span id="maptilerToggleIcon">收起</span></button>
      <div class="collapse-body">
        <div id="basemapOptions"></div>
        <div class="basemap-row"><span><span class="swatch" style="background:#7a5a44"></span>三维地形</span><strong>开启</strong></div>
      </div>
    </section>
    <section class="card">
      <h3>图例</h3>
      <div class="legend-row" style="justify-content:flex-start"><span id="routeLegendSwatch" class="swatch" style="height:4px;background:#ff3d00"></span> 导入轨迹</div>
      <div class="legend-row" style="justify-content:flex-start"><span class="swatch" style="height:2px;background:#7a5a44"></span> 等高线</div>
      <div class="legend-row" style="justify-content:flex-start"><span class="swatch" style="background:#8fb996"></span> 缓坡区域</div>
      <div class="legend-row" style="justify-content:flex-start"><span class="swatch" style="background:#c8b07b"></span> 山脊 / 裸露地</div>
      <div class="legend-subtitle">徒步站点</div>
      <div class="legend-row" style="justify-content:flex-start"><span class="poi-dot" style="background:#2f7d59">补</span> 补给点</div>
      <div class="legend-row" style="justify-content:flex-start"><span class="poi-dot" style="background:#1976d2">站</span> 车站</div>
      <div class="legend-row" style="justify-content:flex-start"><span class="poi-dot" style="background:#f57c00">岔</span> 岔路点</div>
      <div class="legend-row" style="justify-content:flex-start"><span class="poi-dot" style="background:#6a4c93">下</span> 下车点</div>
    </section>
    <section class="card">
      <h3>导入日志</h3>
      <div id="log" style="font-size:11px;color:#546e7a;line-height:1.8">等待路线...</div>
    </section>
  </aside>

  <section class="profile">
    <div class="profile-head">高程剖面 <span id="range">...</span></div>
    <svg id="profileSvg" viewBox="0 0 400 56" width="100%" height="72" preserveAspectRatio="none"></svg>
  </section>

  <div class="error" id="error"></div>

  <script>
    const API_KEY = "of20m5PxKXhEQdliBO3C";
    const QWEATHER_API_KEY = "bb2716f8472740e1abafdf527dca6a0a";
    const QWEATHER_API_HOST = "https://abc1234xyz.def.qweatherapi.com";
    let routeStyle = {
      color: "#ff3d00",
      width: 4,
      opacity: 0.95,
      halo: true,
      milestones: false,
      elevationColor: false
    };
    const profileSvg = document.getElementById("profileSvg");
    const routeOverlay = document.getElementById("routeOverlay");
    const routeTooltip = document.getElementById("routeTooltip");
    const measurementText = document.getElementById("measurementText");
    const routeList = document.getElementById("routeList");
    const basemapOptions = document.getElementById("basemapOptions");
    const routeState = {
      items: [],
      activeId: null,
      nextId: 1,
      overlayFrame: null,
      weatherTimer: null
    };
    let startMarker = null;
    let endMarker = null;
    let middleRotate = null;

    maptilersdk.config.apiKey = API_KEY;

    const map = new maptilersdk.Map({
      container: "map",
      style: maptilersdk.MapStyle.HYBRID,
      center: [113.5532, 22.3432],
      zoom: 13.2,
      pitch: 70,
      bearing: -22,
      maxPitch: 85,
      terrain: true,
      terrainControl: true,
      navigationControl: "top-right"
    });

    const styleChoices = [
      { id: "HYBRID", label: "混合卫星图", swatch: "#607d8b", style: maptilersdk.MapStyle.HYBRID },
      { id: "OUTDOOR", label: "户外地图", swatch: "#8fb996", style: maptilersdk.MapStyle.OUTDOOR },
      { id: "SATELLITE", label: "纯卫星图", swatch: "#263238", style: maptilersdk.MapStyle.SATELLITE },
      { id: "STREETS", label: "街道地图", swatch: "#4f83cc", style: maptilersdk.MapStyle.STREETS },
      { id: "BASIC", label: "基础地图", swatch: "#b0bec5", style: maptilersdk.MapStyle.BASIC },
      { id: "BRIGHT", label: "明亮地图", swatch: "#fbc02d", style: maptilersdk.MapStyle.BRIGHT },
      { id: "TOPO", label: "地形图", swatch: "#8d6e63", style: maptilersdk.MapStyle.TOPO }
    ].filter((choice) => choice.style);
    const styles = Object.fromEntries(styleChoices.map((choice) => [choice.id, choice.style]));

    function renderBasemapOptions(activeId = "HYBRID") {
      basemapOptions.innerHTML = styleChoices.map((choice) => `
        <div class="basemap-row">
          <span><span class="swatch" style="background:${choice.swatch}"></span>${choice.label}</span>
          <button class="${choice.id === activeId ? "active" : ""}" data-style="${choice.id}">${choice.id === activeId ? (choice.id === "HYBRID" ? "默认" : "当前") : "显示"}</button>
        </div>
      `).join("");
      basemapOptions.querySelectorAll("[data-style]").forEach((button) => {
        button.addEventListener("click", () => {
          if (button.classList.contains("active")) return;
          const styleId = button.dataset.style;
          renderBasemapOptions(styleId);
          map.setStyle(styles[styleId]);
          const redrawActiveRoute = () => {
            const route = activeRoute();
            drawRoute(route && route.coords);
            scheduleRouteOverlayUpdate();
          };
          map.once("styledata", redrawActiveRoute);
          map.once("idle", redrawActiveRoute);
        });
      });
    }

    renderBasemapOptions();

    document.getElementById("maptilerToggle").addEventListener("click", () => {
      const card = document.getElementById("maptilerCard");
      card.classList.toggle("collapsed");
      document.getElementById("maptilerToggleIcon").textContent = card.classList.contains("collapsed") ? "展开" : "收起";
    });

    document.getElementById("routeWidth").addEventListener("input", (event) => {
      routeStyle.width = Number(event.target.value);
      document.getElementById("widthValue").textContent = `${routeStyle.width} px`;
      applyRouteStyle();
    });

    document.getElementById("routeOpacity").addEventListener("input", (event) => {
      routeStyle.opacity = Number(event.target.value) / 100;
      document.getElementById("opacityValue").textContent = `${event.target.value}%`;
      applyRouteStyle();
    });

    document.getElementById("routeHalo").addEventListener("change", (event) => {
      routeStyle.halo = event.target.checked;
      applyRouteStyle();
    });

    document.getElementById("routeMilestones").addEventListener("change", (event) => {
      routeStyle.milestones = event.target.checked;
      scheduleRouteOverlayUpdate();
    });

    document.getElementById("routeElevationColor").addEventListener("change", (event) => {
      routeStyle.elevationColor = event.target.checked;
      applyRouteStyle();
    });

    document.querySelectorAll("[data-color]").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-color]").forEach((swatch) => swatch.classList.remove("active"));
        button.classList.add("active");
        routeStyle.color = button.dataset.color;
        const legend = document.getElementById("routeLegendSwatch");
        if (legend) legend.style.background = routeStyle.color;
        applyRouteStyle();
      });
    });

    document.getElementById("kmlInput").addEventListener("change", async (event) => {
      const files = [...(event.target.files || [])];
      if (!files.length) return;
      try {
        for (const file of files) {
          const raw = await file.text();
          addRouteFromRaw(raw, file.name, { activate: file === files[files.length - 1] });
        }
        event.target.value = "";
      } catch (error) {
        showError(error.message);
      }
    });

    document.getElementById("refreshWeather").addEventListener("click", () => updateWeatherForActiveRoute(true));

    function parseKml(raw) {
      return [...raw.matchAll(/<gx:coord>\s*([^<]+?)\s*<\/gx:coord>/g)]
        .map((match) => match[1].trim().split(/\s+/).map(Number))
        .filter((parts) => parts.length >= 3 && parts.every(Number.isFinite))
        .map(([lon, lat, ele]) => [lon, lat, ele]);
    }

    function parseKmlMeta(raw) {
      const valueFor = (name) => {
        const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const match = raw.match(new RegExp(`<Data\\s+name=["']${escaped}["']>[\\s\\S]*?<value>([\\s\\S]*?)<\\/value>`, "i"));
        if (!match) return null;
        const numeric = Number(match[1].replace(/<!\\[CDATA\\[|\\]\\]>/g, "").trim());
        return Number.isFinite(numeric) ? numeric : null;
      };
      return {
        distance: valueFor("Distance"),
        gain: valueFor("ElevationGain"),
        loss: valueFor("ElevationLoss")
      };
    }

    function activeRoute() {
      return routeState.items.find((route) => route.id === routeState.activeId) || routeState.items[0] || null;
    }

    function effectiveDistance(route) {
      return route ? (route.meta.distance || route.summary.distance) : 0;
    }

    function effectiveGain(route) {
      return route ? (route.meta.gain || route.summary.gain) : 0;
    }

    function difficultyFor(route) {
      const score = (effectiveDistance(route) / 1000) + (effectiveGain(route) / 100);
      const stars = Math.max(1, Math.min(5, Math.ceil(score / 10)));
      return { score, stars };
    }

    function difficultyStars(stars) {
      return "★★★★★".slice(0, stars) + "☆☆☆☆☆".slice(0, 5 - stars);
    }

    function routeSummaryLabel(route) {
      const difficulty = difficultyFor(route);
      return `${(effectiveDistance(route) / 1000).toFixed(2)} km · 爬升 ${effectiveGain(route).toFixed(0)} m · ${difficultyStars(difficulty.stars)}`;
    }

    function renderRouteList() {
      if (!routeState.items.length) {
        routeList.innerHTML = `<div class="route-meta" style="padding-left:0">等待导入 KML 路线...</div>`;
        return;
      }

      routeList.innerHTML = routeState.items.map((route) => `
        <div class="route-item ${route.id === routeState.activeId ? "active" : ""} ${route.completed ? "completed" : ""}" data-route-id="${route.id}">
          <div class="route-item-head">
            <input class="route-complete" type="checkbox" ${route.completed ? "checked" : ""} aria-label="标记已走过" />
            <input class="route-name-input" value="${escapeHtml(route.name)}" aria-label="路线名称" />
          </div>
          <div class="route-meta">${routeSummaryLabel(route)}</div>
        </div>
      `).join("");

      routeList.querySelectorAll(".route-item").forEach((item) => {
        const routeId = Number(item.dataset.routeId);
        item.addEventListener("click", () => setActiveRoute(routeId, { fit: true }));
        item.querySelector(".route-complete").addEventListener("click", (event) => event.stopPropagation());
        item.querySelector(".route-complete").addEventListener("change", (event) => {
          const route = routeState.items.find((entry) => entry.id === routeId);
          if (!route) return;
          route.completed = event.target.checked;
          renderRouteList();
        });
        const nameInput = item.querySelector(".route-name-input");
        nameInput.addEventListener("click", (event) => event.stopPropagation());
        nameInput.addEventListener("input", (event) => {
          const route = routeState.items.find((entry) => entry.id === routeId);
          if (!route) return;
          route.name = event.target.value.trim() || route.sourceName;
          if (route.id === routeState.activeId) updatePanels(route);
        });
        nameInput.addEventListener("change", (event) => {
          const route = routeState.items.find((entry) => entry.id === routeId);
          if (!route) return;
          route.name = event.target.value.trim() || route.sourceName;
          renderRouteList();
          updatePanels(activeRoute());
        });
        nameInput.addEventListener("blur", () => renderRouteList());
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function distanceMeters(a, b) {
      const radius = 6371000;
      const toRad = (deg) => deg * Math.PI / 180;
      const dLat = toRad(b[1] - a[1]);
      const dLon = toRad(b[0] - a[0]);
      const lat1 = toRad(a[1]);
      const lat2 = toRad(b[1]);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return 2 * radius * Math.asin(Math.min(1, Math.sqrt(h)));
    }

    function summarize(coords) {
      let distance = 0;
      let gain = 0;
      let loss = 0;
      const cumulative = [0];
      for (let i = 1; i < coords.length; i++) {
        const segment = distanceMeters(coords[i - 1], coords[i]);
        distance += segment;
        cumulative.push(distance);
        const delta = coords[i][2] - coords[i - 1][2];
        if (delta > 0) gain += delta;
        else loss -= delta;
      }
      const lons = coords.map((point) => point[0]);
      const lats = coords.map((point) => point[1]);
      const elevations = coords.map((point) => point[2]);
      return {
        distance,
        gain,
        loss,
        minLon: Math.min(...lons),
        maxLon: Math.max(...lons),
        minLat: Math.min(...lats),
        maxLat: Math.max(...lats),
        minEle: Math.min(...elevations),
        maxEle: Math.max(...elevations),
        cumulative
      };
    }

    function routeGeoJson(coords) {
      return {
        type: "Feature",
        properties: { name: "test.kml" },
        geometry: {
          type: "LineString",
          coordinates: coords.map(([lon, lat]) => [lon, lat])
        }
      };
    }

    function drawRoute(coords) {
      if (!coords || !map.isStyleLoaded()) return;
      if (map.getLayer("route-line")) map.removeLayer("route-line");
      if (map.getLayer("route-halo")) map.removeLayer("route-halo");
      if (map.getLayer("route-samples")) map.removeLayer("route-samples");
      if (map.getSource("route")) map.removeSource("route");
      if (map.getSource("route-sample-points")) map.removeSource("route-sample-points");

      map.addSource("route", {
        type: "geojson",
        data: routeGeoJson(coords)
      });
      map.addSource("route-sample-points", {
        type: "geojson",
        data: {
          type: "FeatureCollection",
          features: coords
            .filter((point, index) => index % 22 === 0 || index === coords.length - 1)
            .map((point) => ({
              type: "Feature",
              properties: {},
              geometry: { type: "Point", coordinates: [point[0], point[1]] }
            }))
        }
      });

      map.addLayer({
        id: "route-halo",
        type: "line",
        slot: "top",
        source: "route",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: {
          "line-color": "#ffffff",
          "line-width": routeStyle.width + 6,
          "line-opacity": routeStyle.halo ? Math.min(0.9, routeStyle.opacity) : 0
        }
      });

      map.addLayer({
        id: "route-line",
        type: "line",
        slot: "top",
        source: "route",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: {
          "line-color": routeStyle.color,
          "line-width": routeStyle.width,
          "line-opacity": routeStyle.opacity
        }
      });

      map.addLayer({
        id: "route-samples",
        type: "circle",
        slot: "top",
        source: "route-sample-points",
        paint: {
          "circle-color": routeStyle.color,
          "circle-radius": Math.max(3, routeStyle.width - 1),
          "circle-stroke-color": "#ffffff",
          "circle-stroke-width": 2,
          "circle-opacity": routeStyle.opacity
        }
      });
    }

    function applyRouteStyle() {
      if (map.getLayer("route-line")) {
        map.setPaintProperty("route-line", "line-color", routeStyle.color);
        map.setPaintProperty("route-line", "line-width", routeStyle.width);
        map.setPaintProperty("route-line", "line-opacity", routeStyle.opacity);
      }
      if (map.getLayer("route-halo")) {
        map.setPaintProperty("route-halo", "line-width", routeStyle.width + 6);
        map.setPaintProperty("route-halo", "line-opacity", routeStyle.halo ? Math.min(0.9, routeStyle.opacity) : 0);
      }
      if (map.getLayer("route-samples")) {
        map.setPaintProperty("route-samples", "circle-color", routeStyle.color);
        map.setPaintProperty("route-samples", "circle-radius", Math.max(3, routeStyle.width - 1));
        map.setPaintProperty("route-samples", "circle-opacity", routeStyle.opacity);
      }
      scheduleRouteOverlayUpdate();
    }

    function drawProfile(coords, summary) {
      const sampleCount = 160;
      const points = [];
      for (let i = 0; i < sampleCount; i++) {
        const index = Math.round(i * (coords.length - 1) / (sampleCount - 1));
        const x = summary.distance ? (summary.cumulative[index] / summary.distance) * 400 : 0;
        const y = 48 - ((coords[index][2] - summary.minEle) / ((summary.maxEle - summary.minEle) || 1)) * 42;
        points.push(`${x.toFixed(1)},${y.toFixed(1)}`);
      }
      profileSvg.innerHTML = `
        <line x1="0" y1="48" x2="400" y2="48" stroke="#d7dee2" stroke-width="1"></line>
        <line x1="0" y1="28" x2="400" y2="28" stroke="#e4e9eb" stroke-width="1"></line>
        <line x1="0" y1="8" x2="400" y2="8" stroke="#e4e9eb" stroke-width="1"></line>
        <polygon points="0,56 ${points.join(" ")} 400,56" fill="#2f7d5926"></polygon>
        <polyline points="${points.join(" ")}" fill="none" stroke="#2f7d59" stroke-width="3"></polyline>
        <g id="profileCursor" style="display:none">
          <line id="profileCursorLine" x1="0" y1="4" x2="0" y2="50" stroke="#ff3d00" stroke-width="2"></line>
          <circle id="profileCursorPoint" cx="0" cy="0" r="4" fill="#ff3d00" stroke="#ffffff" stroke-width="2"></circle>
        </g>
      `;
    }

    function scheduleRouteOverlayUpdate() {
      if (routeState.overlayFrame) return;
      routeState.overlayFrame = requestAnimationFrame(() => {
        routeState.overlayFrame = null;
        const route = activeRoute();
        drawScreenRoute(route && route.coords);
      });
    }

    function elevationColorFor(elevation, summary) {
      const range = (summary.maxEle - summary.minEle) || 1;
      const t = Math.max(0, Math.min(1, (elevation - summary.minEle) / range));
      if (t < 0.25) return "#00acc1";
      if (t < 0.5) return "#43a047";
      if (t < 0.75) return "#fbc02d";
      return "#e64a19";
    }

    function routePointAtDistance(route, targetDistance) {
      const { coords, summary } = route;
      for (let i = 1; i < summary.cumulative.length; i++) {
        if (summary.cumulative[i] < targetDistance) continue;
        const startDistance = summary.cumulative[i - 1];
        const segmentDistance = summary.cumulative[i] - startDistance || 1;
        const t = (targetDistance - startDistance) / segmentDistance;
        const start = coords[i - 1];
        const end = coords[i];
        return [
          start[0] + (end[0] - start[0]) * t,
          start[1] + (end[1] - start[1]) * t,
          start[2] + (end[2] - start[2]) * t
        ];
      }
      return coords[coords.length - 1];
    }

    function routeWeatherPoint(route) {
      if (!route) return null;
      return routePointAtDistance(route, route.summary.distance * 0.5);
    }

    function drawScreenRoute(coords) {
      const route = activeRoute();
      if (!coords || !coords.length || !route) {
        routeOverlay.innerHTML = "";
        return;
      }
      const width = routeOverlay.clientWidth || window.innerWidth;
      const height = routeOverlay.clientHeight || window.innerHeight;
      routeOverlay.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const summary = route.summary;
      const projected = coords
        .filter((point, index) => index % 5 === 0 || index === coords.length - 1)
        .map((point) => {
          const screen = map.project([point[0], point[1]]);
          return { x: screen.x, y: screen.y, elevation: point[2] };
        });
      const points = projected.map((point) => `${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(" ");
      const halo = routeStyle.halo
        ? `<polyline points="${points}" fill="none" stroke="#ffffff" stroke-width="${routeStyle.width + 6}" stroke-linecap="round" stroke-linejoin="round" opacity="${Math.min(0.9, routeStyle.opacity)}"></polyline>`
        : "";
      const routeLine = routeStyle.elevationColor
        ? projected.slice(1).map((point, index) => {
          const previous = projected[index];
          const color = elevationColorFor((point.elevation + previous.elevation) / 2, summary);
          return `<line x1="${previous.x.toFixed(1)}" y1="${previous.y.toFixed(1)}" x2="${point.x.toFixed(1)}" y2="${point.y.toFixed(1)}" stroke="${color}" stroke-width="${routeStyle.width}" stroke-linecap="round" opacity="${routeStyle.opacity}"></line>`;
        }).join("")
        : `<polyline points="${points}" fill="none" stroke="${routeStyle.color}" stroke-width="${routeStyle.width}" stroke-linecap="round" stroke-linejoin="round" opacity="${routeStyle.opacity}"></polyline>`;
      const markers = routeStyle.milestones
        ? Array.from({ length: Math.floor(summary.distance / 1000) }, (_, index) => {
          const km = index + 1;
          const point = routePointAtDistance(route, km * 1000);
          const screen = map.project([point[0], point[1]]);
          return `<g class="milestone-marker" transform="translate(${screen.x.toFixed(1)} ${screen.y.toFixed(1)})"><circle r="5.5" fill="#263238" stroke="#ffffff" stroke-width="2"></circle><text y="-9" text-anchor="middle" fill="#263238">${km} km</text></g>`;
        }).join("")
        : "";
      routeOverlay.innerHTML = `${halo}${routeLine}${markers}`;
    }

    function effectiveLoss(route) {
      return route ? (route.meta.loss || route.summary.loss) : 0;
    }

    function updatePanels(route) {
      if (!route) return;
      const { summary } = route;
      const distance = effectiveDistance(route);
      const gain = effectiveGain(route);
      const loss = effectiveLoss(route);
      const difficulty = difficultyFor(route);
      document.getElementById("distance").textContent = `${(distance / 1000).toFixed(2)} km`;
      document.getElementById("maxElev").textContent = `${summary.maxEle.toFixed(0)} m`;
      document.getElementById("gain").textContent = `${gain.toFixed(0)} m`;
      document.getElementById("loss").textContent = `${loss.toFixed(0)} m`;
      document.getElementById("difficultyStars").textContent = difficultyStars(difficulty.stars);
      document.getElementById("difficultyScore").textContent = `${difficulty.score.toFixed(1)} 分 / ${difficulty.stars} 星`;
      document.getElementById("range").textContent = `${summary.minEle.toFixed(1)} m - ${summary.maxEle.toFixed(1)} m`;
      document.getElementById("log").innerHTML = `当前路线: ${escapeHtml(route.name)}<br>已解析 gx:Track<br>已投影路线几何<br>已生成高程剖面`;
      document.getElementById("status").textContent = `已加载 ${routeState.items.length} 条路线 · 当前: ${route.name}`;
    }

    function showError(message) {
      const error = document.getElementById("error");
      error.textContent = message;
      error.style.display = "block";
      document.getElementById("status").textContent = "演示加载失败";
    }

    function scheduleWeatherUpdate() {
      clearTimeout(routeState.weatherTimer);
      routeState.weatherTimer = setTimeout(() => updateWeatherForActiveRoute(false), 450);
    }

    async function qweatherFetch(path, params) {
      const query = new URLSearchParams({
        lang: "zh",
        unit: "m",
        key: QWEATHER_API_KEY,
        ...params
      });
      const response = await fetch(`${QWEATHER_API_HOST}${path}?${query.toString()}`);
      if (!response.ok) throw new Error(`天气请求失败: ${response.status}`);
      const data = await response.json();
      if (data.code && data.code !== "200") throw new Error(`和风天气返回 ${data.code}`);
      return data;
    }

    async function updateWeatherForActiveRoute(manual) {
      const route = activeRoute();
      const status = document.getElementById("weatherStatus");
      const body = document.getElementById("weatherBody");
      const point = routeWeatherPoint(route);
      if (!route || !point) {
        status.textContent = "等待路线位置...";
        body.style.display = "none";
        return;
      }

      const location = `${point[0].toFixed(2)},${point[1].toFixed(2)}`;
      document.getElementById("weatherLocation").textContent = `路线中点 ${point[1].toFixed(3)}, ${point[0].toFixed(3)}`;
      status.textContent = manual ? "正在刷新天气..." : "正在获取天气...";
      body.style.display = "none";

      try {
        const [nowData, hourlyData, dailyData] = await Promise.all([
          qweatherFetch("/v7/weather/now", { location }),
          qweatherFetch("/v7/weather/24h", { location }),
          qweatherFetch("/v7/weather/3d", { location })
        ]);
        renderWeather(nowData.now, hourlyData.hourly || [], (dailyData.daily || [])[0]);
        status.textContent = `更新时间 ${formatWeatherTime(nowData.updateTime || nowData.now.obsTime)}`;
        body.style.display = "block";
      } catch (error) {
        status.textContent = "天气暂不可用。请确认和风 API Key、API Host 或公网访问配置。";
        body.style.display = "none";
        if (manual) console.warn(error);
      }
    }

    function renderWeather(now, hourly, today) {
      const nextHours = hourly.slice(0, 6);
      const rainProbability = Math.max(0, ...nextHours.map((hour) => Number(hour.pop) || 0));
      const rainAmount = nextHours.reduce((sum, hour) => sum + (Number(hour.precip) || 0), 0);
      const windSpeed = Math.max(Number(now.windSpeed) || 0, ...nextHours.map((hour) => Number(hour.windSpeed) || 0));
      const windScale = now.windScale || (today && today.windScaleDay) || "--";
      const uvIndex = today && today.uvIndex ? Number(today.uvIndex) : null;

      document.getElementById("weatherTemp").textContent = `${now.temp || "--"}°`;
      document.getElementById("weatherDesc").innerHTML = `${now.text || "--"}<br>今日 ${today ? `${today.tempMin}° - ${today.tempMax}°` : "--"} · 气压 ${now.pressure || "--"} hPa`;
      document.getElementById("weatherFeels").textContent = `${now.feelsLike || "--"}°C`;
      document.getElementById("weatherWind").textContent = `${now.windDir || "--"} ${windScale}级`;
      document.getElementById("weatherRain").textContent = `${rainProbability}% / ${rainAmount.toFixed(1)} mm`;
      document.getElementById("weatherUv").textContent = uvIndex == null ? "--" : `${uvIndex}`;
      document.getElementById("weatherHumidity").textContent = `${now.humidity || "--"}%`;
      document.getElementById("weatherVisibility").textContent = `${now.vis || "--"} km`;
      document.getElementById("weatherAdvice").textContent = buildWeatherAdvice({
        temp: Number(now.temp),
        feelsLike: Number(now.feelsLike),
        rainProbability,
        rainAmount,
        windSpeed,
        windScale,
        humidity: Number(now.humidity),
        visibility: Number(now.vis),
        uvIndex
      });
    }

    function buildWeatherAdvice(metric) {
      const notes = [];
      if (metric.rainProbability >= 60 || metric.rainAmount >= 2) notes.push("降水风险偏高，建议带雨具并预留撤退时间");
      if (metric.windSpeed >= 28 || Number.parseInt(metric.windScale, 10) >= 5) notes.push("风力较强，山脊和开阔路段注意防风");
      if (metric.uvIndex >= 7) notes.push("紫外线强，注意防晒和补水");
      if (metric.feelsLike >= 32) notes.push("体感较热，建议降低配速并增加补水");
      if (metric.feelsLike <= 5) notes.push("体感较冷，注意保温和防风层");
      if (metric.visibility > 0 && metric.visibility < 5) notes.push("能见度较低，注意导航和队伍间距");
      if (!notes.length) notes.push("天气风险较低，常规携带雨具、补水和防晒用品");
      return notes.slice(0, 2).join("；") + "。";
    }

    function formatWeatherTime(value) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function setRouteMarkers(coords) {
      if (startMarker) startMarker.remove();
      if (endMarker) endMarker.remove();
      startMarker = new maptilersdk.Marker({ color: "#2f7d59" }).setLngLat([coords[0][0], coords[0][1]]).addTo(map);
      endMarker = new maptilersdk.Marker({ color: "#263238" }).setLngLat([coords[coords.length - 1][0], coords[coords.length - 1][1]]).addTo(map);
    }

    function addRouteFromRaw(raw, fileName, options = {}) {
      const coords = parseKml(raw);
      const meta = parseKmlMeta(raw);
      if (!coords.length) throw new Error("KML 中未找到 gx:coord 轨迹点");
      const id = routeState.nextId++;
      const fallbackName = `路线 ${id}`;
      const route = {
        id,
        name: fileName || fallbackName,
        sourceName: fileName || fallbackName,
        completed: false,
        coords,
        meta,
        summary: summarize(coords)
      };
      routeState.items.push(route);
      renderRouteList();
      if (options.activate !== false) setActiveRoute(route.id, { fit: true });
      return route;
    }

    function setActiveRoute(routeId, options = {}) {
      const route = routeState.items.find((entry) => entry.id === routeId);
      if (!route) return;
      routeState.activeId = route.id;
      window.routeData = route.coords;
      window.routeMeta = route.meta;
      window.routeSummary = route.summary;
      drawRoute(route.coords);
      setRouteMarkers(route.coords);
      drawProfile(route.coords, route.summary);
      updatePanels(route);
      renderRouteList();
      scheduleRouteOverlayUpdate();
      scheduleWeatherUpdate();
      if (options.fit) fitToRoute(route);
    }

    function fitToRoute(route) {
      const { summary } = route;
      const highRelief = summary.maxEle > 1200 || summary.distance > 50000;
      map.fitBounds([[summary.minLon, summary.minLat], [summary.maxLon, summary.maxLat]], {
        padding: { top: 100, right: 270, bottom: 170, left: 330 },
        pitch: highRelief ? 58 : 70,
        bearing: highRelief ? -14 : -22,
        duration: 900
      });
      scheduleRouteOverlayUpdate();
      map.once("moveend", scheduleRouteOverlayUpdate);
      map.once("idle", scheduleRouteOverlayUpdate);
    }

    function nearestRouteIndex(clientX, clientY) {
      const coords = window.routeData;
      if (!coords || !coords.length) return null;
      let bestIndex = -1;
      let bestDistance = Infinity;
      for (let i = 0; i < coords.length; i += 2) {
        const point = map.project([coords[i][0], coords[i][1]]);
        const dx = point.x - clientX;
        const dy = point.y - clientY;
        const distance = dx * dx + dy * dy;
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = i;
        }
      }
      const threshold = Math.max(36, routeStyle.width + 20);
      return Math.sqrt(bestDistance) <= threshold ? bestIndex : null;
    }

    function updateProfileCursor(index) {
      const coords = window.routeData;
      const summary = window.routeSummary;
      if (!coords || !summary || index == null) return;
      const x = summary.distance ? (summary.cumulative[index] / summary.distance) * 400 : 0;
      const y = 48 - ((coords[index][2] - summary.minEle) / ((summary.maxEle - summary.minEle) || 1)) * 42;
      const group = document.getElementById("profileCursor");
      const line = document.getElementById("profileCursorLine");
      const point = document.getElementById("profileCursorPoint");
      if (!group || !line || !point) return;
      group.style.display = "block";
      line.setAttribute("x1", x.toFixed(1));
      line.setAttribute("x2", x.toFixed(1));
      point.setAttribute("cx", x.toFixed(1));
      point.setAttribute("cy", y.toFixed(1));
    }

    function clearHover() {
      routeTooltip.style.display = "none";
      const cursor = document.getElementById("profileCursor");
      if (cursor) cursor.style.display = "none";
      measurementText.innerHTML = "将鼠标移到轨迹上<br>距离和高程会在这里更新。";
    }

    function handleRouteHover(event) {
      if (middleRotate) return;
      if (event.target.closest && event.target.closest(".panel, .topbar, .profile")) {
        clearHover();
        return;
      }
      const index = nearestRouteIndex(event.clientX, event.clientY);
      if (index == null) {
        clearHover();
        return;
      }
      const coords = window.routeData;
      const summary = window.routeSummary;
      const point = coords[index];
      const km = summary.distance ? summary.cumulative[index] / 1000 : 0;
      routeTooltip.style.display = "block";
      routeTooltip.style.left = `${event.clientX + 14}px`;
      routeTooltip.style.top = `${event.clientY - 48}px`;
      routeTooltip.innerHTML = `<strong>${km.toFixed(2)} km</strong>海拔 ${point[2].toFixed(1)} m<br>${point[1].toFixed(6)}, ${point[0].toFixed(6)}`;
      measurementText.innerHTML = `距离: ${km.toFixed(2)} km<br>海拔: ${point[2].toFixed(1)} m<br>纬经度: ${point[1].toFixed(6)}, ${point[0].toFixed(6)}`;
      updateProfileCursor(index);
    }

    function setupMiddleMouseRotation() {
      const canvas = map.getCanvas();
      canvas.addEventListener("mousedown", (event) => {
        if (event.button !== 1) return;
        event.preventDefault();
        middleRotate = {
          x: event.clientX,
          y: event.clientY,
          bearing: map.getBearing(),
          pitch: map.getPitch()
        };
        canvas.style.cursor = "grabbing";
      });
      window.addEventListener("mousemove", (event) => {
        if (!middleRotate) return;
        event.preventDefault();
        const dx = event.clientX - middleRotate.x;
        const dy = event.clientY - middleRotate.y;
        map.setBearing(middleRotate.bearing + dx * 0.35);
        map.setPitch(Math.max(0, Math.min(85, middleRotate.pitch - dy * 0.18)));
        scheduleRouteOverlayUpdate();
      });
      window.addEventListener("mouseup", (event) => {
        if (event.button !== 1 || !middleRotate) return;
        middleRotate = null;
        canvas.style.cursor = "";
      });
      canvas.addEventListener("auxclick", (event) => {
        if (event.button === 1) event.preventDefault();
      });
    }

    map.on("load", async () => {
      try {
        setupMiddleMouseRotation();
        map.on("move", scheduleRouteOverlayUpdate);
        map.on("render", scheduleRouteOverlayUpdate);
        map.on("resize", scheduleRouteOverlayUpdate);
        window.addEventListener("mousemove", handleRouteHover);
        map.getCanvas().addEventListener("mouseleave", clearHover);
        const bundledFiles = ["test.kml", "test2.kml", "test3.kml"];
        for (const fileName of bundledFiles) {
          const response = await fetch(`/files/${fileName}`);
          if (!response.ok && fileName === "test.kml") throw new Error(`KML 请求失败: ${response.status}`);
          if (!response.ok) continue;
          addRouteFromRaw(await response.text(), fileName, { activate: false });
        }
        const firstRoute = routeState.items[0];
        if (!firstRoute) throw new Error("未找到可加载的 KML 示例");
        setActiveRoute(firstRoute.id, { fit: true });
        setTimeout(() => {
          map.flyTo({
            center: [113.5532, 22.3432],
            zoom: 14.9,
            pitch: 72,
            bearing: -28,
            duration: 900
          });
          map.once("moveend", scheduleRouteOverlayUpdate);
          map.once("idle", scheduleRouteOverlayUpdate);
        }, 1300);
      } catch (error) {
        showError(error.message);
      }
    });

    map.on("error", (event) => {
      const message = event && event.error ? event.error.message : "MapTiler 地图错误";
      if (/api|key|token|401|403/i.test(message)) showError(message);
    });
  </script>
</body>
</html>
